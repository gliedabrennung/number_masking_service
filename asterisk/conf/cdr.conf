;
; Asterisk's own CDR is kept as a *backup* record for incident forensics. The
; authoritative journal is the `calls` table written by the ARI application,
; because only that one is tied to a session_id.
;
[general]
enable=yes
unanswered=yes
congestion=yes

[csv]
usegmtime=yes
loguniqueid=yes
loguserfield=yes
