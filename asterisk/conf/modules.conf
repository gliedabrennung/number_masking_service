;
; Autoload everything except call recording. Recording is out of scope by
; contract, so the modules that could write audio to disk are not loaded at
; all — the guarantee is structural, not a matter of configuration discipline.
;
[modules]
autoload=yes

noload => app_record.so
noload => app_mixmonitor.so
; The ARI recording resources and SIP one-touch recording are unloaded too.
; res_stasis_recording itself must stay: res_ari_channels, res_ari_bridges and
; res_ari_playbacks depend on it, and without them the service has no ARI at
; all. What makes recording impossible in practice is the missing spool
; directory (see docker-entrypoint.sh) plus these two modules.
noload => res_ari_recordings.so
noload => res_pjsip_one_touch_record_info.so
noload => res_mwi_external.so
noload => chan_iax2.so
noload => chan_dahdi.so

; Signalling stack: chan_pjsip only (chan_sip was removed in Asterisk 21).
preload => res_pjproject.so
