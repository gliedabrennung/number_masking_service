# fail2ban filter for the Asterisk container of the masking stand.
#
# Install on the host:
#   cp deploy/fail2ban/asterisk-masking.conf /etc/fail2ban/filter.d/
#   cp deploy/fail2ban/jail-asterisk-masking.conf /etc/fail2ban/jail.d/
#   systemctl reload fail2ban
#
# The log lives in the `asterisk-log` volume; the jail file resolves it.

[INCLUDES]
before = common.conf

[Definition]

_daemon = asterisk

# chan_pjsip reports failed authentication and unknown endpoints through
# res_pjsip's security events.
failregex = ^%(__prefix_line)sNOTICE.* .*: Registration from '[^']*' failed for '<HOST>(:\d+)?' - (Wrong password|Username/auth name mismatch|No matching endpoint found|Not a local domain)$
            ^%(__prefix_line)sNOTICE.* .*: Request '[^']*' from '[^']*' failed for '<HOST>(:\d+)?' - (No matching endpoint found|Not a local domain|Failed to authenticate)$
            ^%(__prefix_line)sNOTICE.* .*: Request '[^']*' from '[^']*' failed for '<HOST>(:\d+)?' \(callid: [^)]*\) - (No matching endpoint found|Not a local domain|Failed to authenticate)$
            ^%(__prefix_line)sSECURITY.*SecurityEvent="(FailedACL|InvalidAccountID|ChallengeResponseFailed|InvalidPassword)".*RemoteAddress="[^/]*/[^/]*/<HOST>/\d+"

ignoreregex =
