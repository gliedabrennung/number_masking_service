# Jail for the SIP port of the masking stand.
#
# `logpath` points at the Asterisk log inside the docker volume; adjust the
# volume name if the compose project was renamed. Find it with:
#   docker volume inspect number_masking_service_asterisk-log -f '{{.Mountpoint}}'

[asterisk-masking]
enabled  = true
filter   = asterisk-masking
port     = 5060,5061
protocol = udp
logpath  = /var/lib/docker/volumes/number_masking_service_asterisk-log/_data/messages
maxretry = 5
findtime = 600
bantime  = 3600
banaction = iptables-allports
