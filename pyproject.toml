[project]
name = "number-masking-service"
version = "0.1.0"
description = "Phone number masking prototype: Asterisk 22 LTS + ARI, FastAPI control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "websockets>=14.0",
    "structlog>=24.4",
    "cryptography>=44.0",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "respx>=0.22",
]

[project.scripts]
masking-api = "app.main:main"
masking-ari = "app.ari_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: the database engine is a session-scoped
# fixture and asyncpg connections cannot cross loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires PostgreSQL and Redis (run via `make test-integration`)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# Google Python Style Guide, section 3.2.
line-length = 80
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting (guide 3.13)
    "N",    # pep8-naming (guide 3.16)
    "D",    # pydocstyle (guide 3.8)
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ASYNC",
    "S101", # no bare assert in production code (guide 2.4)
    "TID252",  # no relative imports (guide 2.2)
]
ignore = [
    "B008",  # FastAPI dependency defaults are evaluated once by design
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: assert is expected (guide 2.4), and docstrings are optional (3.8.2.1).
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104"]
"migrations/**" = ["D103"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["app"]
